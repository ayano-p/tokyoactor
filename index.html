<script>
// オープニング
window.addEventListener('DOMContentLoaded', () => {
    document.body.classList.add('no-scroll');
    setTimeout(() => {
        const mask = document.getElementById('opening-mask');
        if (mask) {
            mask.style.opacity = '0';
            mask.style.visibility = 'hidden'; 
        }
        document.body.classList.remove('no-scroll');
    }, 1800); 
});

function toggleMute(btn) {
    const v = btn.parentElement.querySelector('video');
    const img = btn.querySelector('img');
    if (v) {
        v.muted = !v.muted;
        if (img) {
            img.src = v.muted ? '../../common/images/icon/spkoff.png' : '../../common/images/icon/spkon.png';
        }
    }
}

document.querySelectorAll('.grid-item input, .swiper-slide input').forEach(input => {
    input.addEventListener('change', function() {
        const id = this.id;
        const overlay = document.getElementById('overlay-' + id);
        const item = this.closest('.grid-item') || this.closest('.swiper-slide');
        const slideVideo = item.querySelector(':scope > label > video');

        if (this.checked) {
            if (overlay) overlay.classList.add('is-active');
            const popVideo = overlay ? overlay.querySelector('video') : null;
            if (popVideo) {
                popVideo.load();
                popVideo.play().then(() => {
                    popVideo.pause();
                }).catch(e => {
                    console.log("プレビュー強制描画:", e);
                });
            }
            if (slideVideo) slideVideo.pause();
        } else {
            if (overlay) {
                overlay.classList.remove('is-active');
                const popVideo = overlay.querySelector('video');
                if (popVideo) {
                    popVideo.pause();
                    popVideo.currentTime = 0;
                }
            }
            if (slideVideo) {
                slideVideo.muted = true;
                slideVideo.play();
                const muteBtn = item.querySelector('.mute-btn');
                if (muteBtn) {
                    const img = muteBtn.querySelector('img');
                    if (img) img.src = '../../common/images/icon/spkoff.png';
                }
            }
        }
    });
});


function calculateAge(year, month, day) {
    if (!year || !month || !day) return "";
    const today = new Date();
    const birthDate = new Date(year, month - 1, day);
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;
}

const descEl = document.getElementById('slide-description');


function renderContent(index) {
    if (!descEl) return;
    descEl.innerHTML = descriptions[index] || "";
    
    const ageSpan = document.getElementById('my-age');
    if (ageSpan && birthDates[index]) {
        const [y, m, d] = birthDates[index];
        ageSpan.textContent = calculateAge(y, m, d);
    }
}

function updateDescription(index) {
    if (!descEl) return;
    descEl.classList.add('fade-out');
    setTimeout(() => {
        renderContent(index);
        descEl.classList.remove('fade-out');
    }, 300);
}



// メインSwiper
const swiperVideos = document.querySelectorAll('.mainSwiper video');
const mainSwiper = new Swiper(".mainSwiper", {
    effect: "coverflow",
    grabCursor: true,
    centeredSlides: true,
    slidesPerView: "auto",
    loop: false, 
    initialSlide: 2,
    spaceBetween: -50,
    coverflowEffect: {
        rotate: 40,
        stretch: 0,
        depth: 700,
        modifier: 1,
        slideShadows: true,
        scale: 0.8,
    },
    on: {
        init: function () {
            renderContent(this.initialSlide);
            if (descEl) {
                descEl.classList.remove('fade-out');
            }
        },
        slideChange: function () {
            swiperVideos.forEach(v => {
                v.muted = true;
                v.pause();
                v.currentTime = 0;
                const btn = v.closest('.swiper-slide').querySelector('.mute-btn img');
                if (btn) btn.src = '../../common/images/icon/spkoff.png';
            });
            const activeSlide = this.slides[this.activeIndex];
            const activeVideo = activeSlide.querySelector('video');
            if (activeVideo) {
                activeVideo.play().catch(e => console.warn("再生中断:", e));
            }
            updateDescription(this.activeIndex);
        }
    }
});


swiperVideos.forEach(v => {
    v.addEventListener('timeupdate', () => {
        const bar = v.parentElement.querySelector('.progress-bar-inner');
        if (bar) {
            const percent = (v.currentTime / v.duration) * 100;
            bar.style.width = percent + '%';
        }
    });
});
