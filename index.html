/* 全体 */
body, table, td, h1, span, div, p {

html, body {

.full-width {

/* オープニング */
#opening-mask {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #fcfcfc;
    z-index: 99999;
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 1;
    transition: opacity 0.8s ease-in-out, visibility 0.8s;
}

.opening-text {
    font-size: clamp(32px, 6vw, 60px);
    color: #555555;
    font-family: 'Yu Mincho', serif;
    letter-spacing: 0.1em;
    opacity: 0;
    transform: translateY(10px);

}

@keyframes fadeInUp {
    0% { opacity: 0; transform: translateY(10px); }
    100% { opacity: 1; transform: translateY(0); }
}

body.no-scroll {
    overflow: hidden;
}

.video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    overflow: hidden;
}

.video-bg::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(255, 255, 255, 0.8); 
    pointer-events: none; 
}

.video-bg video {
    width: 100%;
    height: 100%;
    object-fit: cover; 
}

.content {
    position: relative;
    z-index: 1;
}

/* 3Dキューブ*/
.scene {
    width: 250px;
    height: 250px;
    margin: 100px auto 150px auto;
    perspective: 800px;
    user-select: none;
    cursor: grab;
    touch-action: none;
}

.scene:active {
    cursor: grabbing;
}

.cube {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
}

.face {
    position: absolute;
    width: 250px;
    height: 250px;
    border: 2px solid rgba(255, 255, 255, 0.8);
    box-sizing: border-box;
    background: #111;
    cursor: pointer;
    backface-visibility: hidden;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.face img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
}

.front  { transform: rotateY(0deg) translateZ(125px); }
.back   { transform: rotateY(180deg) translateZ(125px); }
.right  { transform: rotateY(90deg) translateZ(125px); }
.left   { transform: rotateY(-90deg) translateZ(125px); }
.top    { transform: rotateX(90deg) translateZ(125px); }
.bottom { transform: rotateX(-90deg) translateZ(125px); }

/* モーダル（ポップアップ） */
.modal {
    display: none;
    position: fixed;
    z-index: 999999;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    justify-content: center;
    align-items: center;

.modal.show {

<script>
// オープニング
window.addEventListener('DOMContentLoaded', () => {
    document.body.classList.add('no-scroll');
    setTimeout(() => {
        const mask = document.getElementById('opening-mask');
        if (mask) {
            mask.style.opacity = '0';
            mask.style.visibility = 'hidden'; 
        }
        document.body.classList.remove('no-scroll');
    }, 1800); 
});

function toggleMute(btn) {
    const v = btn.parentElement.querySelector('video');
    const img = btn.querySelector('img');
    if (v) {
        v.muted = !v.muted;
        if (img) {
            img.src = v.muted ? 'common/images/icon/spkoff.png' : 'common/images/icon/spkon.png';
        }
    }
}

// --------------------------------------------------
// 3Dキューブ制御スクリプト
// --------------------------------------------------
const scene = document.getElementById('scene');
const cube = document.getElementById('cube');
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');
const modalVideo = document.getElementById('modalVideo');
const modalClose = document.getElementById('modalClose');

let rotX = 0, rotY = 0;
let targetRotX = 0, targetRotY = 0;
let isDragging = false;
let isDraggedFar = false;
let startX = 0, startY = 0;
let lastX = 0, lastY = 0;
let activeAxis = null;
let idleTimer = null;
let isAutoRotating = false;

function resetIdleTimer() {
    clearTimeout(idleTimer);
    isAutoRotating = false;
    idleTimer = setTimeout(() => {
        targetRotX = Math.round(targetRotX / 90) * 90;
        targetRotY = Math.round(targetRotY / 90) * 90;
        isAutoRotating = true;
    }, 1500);
}

function updateCube() {
    if (isAutoRotating && !isDragging) {
        targetRotX -= 0.05;
        targetRotY += 0.08;
    }

    rotX += (targetRotX - rotX) * 0.1;
    rotY += (targetRotY - rotY) * 0.1;

    cube.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    requestAnimationFrame(updateCube);
}

resetIdleTimer();
updateCube();

function getPos(e) {
    return {
        x: e.touches ? e.touches[0].clientX : e.clientX,
        y: e.touches ? e.touches[0].clientY : e.clientY
    };
}

function onStart(e) {
    isDragging = true;
    isDraggedFar = false;
    activeAxis = null;
    clearTimeout(idleTimer);
    isAutoRotating = false;

    const pos = getPos(e);
    startX = pos.x;
    startY = pos.y;
    lastX = pos.x;
    lastY = pos.y;
}

function onMove(e) {
    if (!isDragging) return;

    const pos = getPos(e);
    const deltaX = pos.x - lastX;
    const deltaY = pos.y - lastY;
    const totalDist = Math.hypot(pos.x - startX, pos.y - startY);

    if (totalDist > 6) {
        isDraggedFar = true;
    }

    if (!activeAxis && totalDist > 8) {
        activeAxis = Math.abs(pos.x - startX) > Math.abs(pos.y - startY) ? 'y' : 'x';
    }

    if (activeAxis === 'y') {
        targetRotY += deltaX * 0.6;
        targetRotX = 0;
    } else if (activeAxis === 'x') {
        targetRotX -= deltaY * 0.6;
        targetRotY = 0;
    }

    lastX = pos.x;
    lastY = pos.y;
}

function onEnd() {
    if (!isDragging) return;
    isDragging = false;

    if (activeAxis === 'y') {
        targetRotY = Math.round(targetRotY / 90) * 90;
    } else if (activeAxis === 'x') {
        targetRotX = Math.round(targetRotX / 90) * 90;
    } else {
        targetRotX = Math.round(targetRotX / 90) * 90;
        targetRotY = Math.round(targetRotY / 90) * 90;
    }

    resetIdleTimer();
}

scene.addEventListener('mousedown', onStart);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onEnd);

scene.addEventListener('touchstart', onStart, { passive: true });
window.addEventListener('touchmove', onMove, { passive: true });
window.addEventListener('touchend', onEnd);

let wheelCooling = false;
scene.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (wheelCooling) return;

    clearTimeout(idleTimer);
    isAutoRotating = false;

    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) {
        targetRotX = 0;
        targetRotY -= e.deltaX > 0 ? 90 : -90;
    } else {
        targetRotY = 0;
        targetRotX += e.deltaY > 0 ? 90 : -90;
    }

    wheelCooling = true;
    setTimeout(() => { wheelCooling = false; }, 300);

    resetIdleTimer();
}, { passive: false });

document.querySelectorAll('.face').forEach(face => {
    face.addEventListener('click', () => {
        if (isDraggedFar) return;

        const img = face.querySelector('img');
        if (img) {
            modalVideo.style.display = 'none';
            modalVideo.pause();
            
            modalImg.src = img.src;
            modalImg.style.display = 'block';
            modal.classList.add('show');
            clearTimeout(idleTimer);
            isAutoRotating = false;
        }
    });
});

function closeModal() {
    modal.classList.remove('show');
    if (modalVideo) {
        modalVideo.pause();
        modalVideo.currentTime = 0;
    }

    if (typeof mainSwiper !== 'undefined' && mainSwiper.slides) {
        const activeSlide = mainSwiper.slides[mainSwiper.activeIndex];
        if (activeSlide) {
            const activeVideo = activeSlide.querySelector('video');
            if (activeVideo) {
                activeVideo.muted = true;
                
                const btnImg = activeSlide.querySelector('.mute-btn img');
                if (btnImg) {
                    btnImg.src = 'common/images/icon/spkoff.png';
                }

                activeVideo.play().catch(err => console.warn("動画再生エラー:", err));
            }
        }
    }
    resetIdleTimer();
}

modalClose.addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
});

function calculateAge(year, month, day) {
    if (!year || !month || !day) return "";
    const today = new Date();
    const birthDate = new Date(year, month - 1, day);
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
        age--;
    }
    return age;
}

const descEl = document.getElementById('slide-description');

function renderContent(index) {
    if (!descEl) return;
    descEl.innerHTML = descriptions[index] || "";
    
    const ageSpan = document.getElementById('my-age');
    if (ageSpan && birthDates[index]) {
        const [y, m, d] = birthDates[index];
        ageSpan.textContent = calculateAge(y, m, d);
    }
}

function updateDescription(index) {
    if (!descEl) return;
    descEl.classList.add('fade-out');
    setTimeout(() => {
        renderContent(index);
        descEl.classList.remove('fade-out');
    }, 300);
}

    // メインSwiper
    const swiperVideos = document.querySelectorAll('.mainSwiper video');
    const mainSwiper = new Swiper(".mainSwiper", {
        effect: "coverflow",
        grabCursor: true,
        centeredSlides: true,
        slidesPerView: "auto",
        loop: false, 
        initialSlide: 2,
        spaceBetween: -50,
        coverflowEffect: {
            rotate: 40,
            stretch: 0,
            depth: 700,
            modifier: 1,
            slideShadows: true,
            scale: 0.8,
        },
        on: {
            init: function () {
                if (descEl) {
                    descEl.innerHTML = descriptions[this.initialSlide] || descriptions[0];
                }
            },
            slideChange: function () {
                swiperVideos.forEach(v => {
                    v.muted = true;
                    v.pause();
                    v.currentTime = 0;
                    const btn = v.closest('.swiper-slide').querySelector('.mute-btn img');
                    if (btn) btn.src = 'common/images/icon/spkoff.png';
                });
                const activeSlide = this.slides[this.activeIndex];
                const activeVideo = activeSlide.querySelector('video');
                if (activeVideo) {
                    activeVideo.play().catch(e => console.warn("再生中断:", e));
                }
                updateDescription(this.activeIndex);
            }
        }
    });

document.querySelectorAll('.mainSwiper .swiper-slide').forEach(slide => {
    slide.addEventListener('click', (e) => {
        if (e.target.closest('.mute-btn')) return;

        const video = slide.querySelector('video');
        if (video && modalVideo) {
            video.pause();

            modalImg.style.display = 'none';

            modalVideo.src = video.currentSrc || video.src;
            modalVideo.style.display = 'block';
            
            modal.classList.add('show');
            
            modalVideo.muted = false;
            modalVideo.play().catch(err => console.warn("動画再生エラー:", err));

            clearTimeout(idleTimer);
            isAutoRotating = false;
        }
    });
});
