<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <link rel="icon" href="common/images/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="common/images/icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ambient background floating glow elements */
        .glow-bg {
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.12) 0%, rgba(255, 255, 255, 0) 70%);
            filter: blur(40px);
            animation: pulseGlow 4s infinite alternate ease-in-out;
        }

        @keyframes pulseGlow {
            0% { transform: scale(0.8) translate(-10px, -10px); opacity: 0.5; }
            100% { transform: scale(1.2) translate(10px, 10px); opacity: 0.9; }
        }

        /* Logo reveal and floating animation */
        .logo-container {
            animation: fadeInScale 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards,
                        float 3s ease-in-out infinite 1.2s;
            opacity: 0;
            transform: scale(0.85) translateY(10px);
        }

        @keyframes fadeInScale {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Subtle drop shadow/glow for the icon image */
        .icon-glow {
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.08));
            transition: filter 0.3s ease, transform 0.3s ease;
        }
        .icon-glow:hover {
            filter: drop-shadow(0 18px 36px rgba(99, 102, 241, 0.22));
            transform: scale(1.03);
        }

        /* Fade-in animation for text */
        .fade-in-delayed {
            animation: fadeIn 0.8s ease-out 0.6s forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }
    </style>
</head>
<body class="bg-white text-slate-800 min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-sans select-none">

    <!-- Glowing background elements -->
    <div class="glow-bg top-1/4 left-1/4"></div>
    <div class="glow-bg bottom-1/4 right-1/4" style="animation-delay: -2s; background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(255, 255, 255, 0) 70%);"></div>

    <!-- Main Content -->
    <main class="relative z-10 flex flex-col items-center text-center p-6 max-w-md w-full">
        
        <!-- Clickable Icon container -->
        <a id="redirect-link" href="https://ayano-p.github.io/infotokyoactor/" class="logo-container block mb-8 cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 rounded-3xl p-2 transition">
            <img 
                src="common/images/icon.png" 
                alt="Logo" 
                class="w-48 h-48 md:w-60 md:h-60 object-contain icon-glow rounded-3xl"
                onerror="this.onerror=null; this.src='https://placehold.co/240x240/f8fafc/6366f1?text=Icon';"
            />
        </a>

        <!-- Redirect Message & Loader -->
        <div class="fade-in-delayed w-full flex flex-col items-center">
            <h1 class="text-2xl font-light tracking-wide text-slate-900 mb-2 font-serif">
                とある東京の役者
            </h1>
            <p class="text-xs text-slate-500 mb-6 tracking-wider font-medium">
                Transition to ...
            </p>

            <!-- Percent Text Display (Serif & Light Font) -->
            <div class="text-xl font-serif font-light text-slate-700 tracking-widest mb-8">
                <span id="percent-text">0%</span>
            </div>
        </div>

    </main>

    <!-- Auto-redirection & Counter script -->
    <script>
        const TARGET_URL = "https://ayano-p.github.io/infotokyoactor/";
        const REDIRECT_DELAY_MS = 2500; // Delay before redirection (2.5s)

        // Count up percentage to 100%
        function startCountUp() {
            const percentElement = document.getElementById('percent-text');
            const startTime = performance.now();

            function updateCount(currentTime) {
                const elapsedTime = currentTime - startTime;
                const progress = Math.min(elapsedTime / REDIRECT_DELAY_MS, 1);
                const currentPercent = Math.floor(progress * 100);

                percentElement.textContent = `${currentPercent}%`;

                if (progress < 1) {
                    requestAnimationFrame(updateCount);
                } else {
                    window.location.href = TARGET_URL;
                }
            }

            requestAnimationFrame(updateCount);
        }

        // Start counter on DOM content load
        window.addEventListener('DOMContentLoaded', startCountUp);
    </script>
</body>
</html>
